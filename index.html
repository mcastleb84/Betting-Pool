<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool Board</title>
<meta name="theme-color" content="#17784a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column "pool slip" — pool tabs on top, the two numbers people ask about (pot + buy-in) as the hero, then payouts, then the roster. */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface2:#f6f8f4; --ink:#14211a; --muted:#5b6a61; --line:#d9e0d8;
  --money:#17784a; --money-soft:#e2f2e8; --gold:#b97a08; --gold-soft:#fbf0d9; --warn:#b3412c; --warn-soft:#f9e5e0; --on-money:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --surface2:#1b2720; --ink:#edf2ec; --muted:#98a89e; --line:#28362d;
  --money:#46c784; --money-soft:#173426; --gold:#f2b33d; --gold-soft:#33290f; --warn:#f08a74; --warn-soft:#3a1d17; --on-money:#06140c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --surface2:#1b2720; --ink:#edf2ec; --muted:#98a89e; --line:#28362d;
  --money:#46c784; --money-soft:#173426; --gold:#f2b33d; --gold-soft:#33290f; --warn:#f08a74; --warn-soft:#3a1d17; --on-money:#06140c; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
a{color:var(--money)}
.auth{display:flex;flex-direction:column;gap:10px}
.auth .row2{display:flex;gap:8px;flex-wrap:wrap}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{font-size:14px}
.linkbox button{flex:none;white-space:nowrap}
.mine{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mine li{border-top:1px solid var(--line)}
.mine li:first-child{border-top:0}
.mine a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;color:var(--ink);text-decoration:none;font-weight:600}
.mine a span:last-child{color:var(--money);font-variant-numeric:tabular-nums}
.you{padding:10px 12px;border-radius:10px;background:var(--money-soft);color:var(--money);font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:600 15px var(--body);cursor:pointer;border-radius:10px;border:1px solid transparent;padding:10px 16px;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--money);outline-offset:2px}
.primary{background:var(--money);color:var(--on-money)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.danger{background:var(--warn-soft);color:var(--warn)}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.slip-head{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.slip-head h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--money-soft);color:var(--money)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.hero>div{padding:14px 18px;min-width:0}
.hero>div+div{border-left:1px dashed var(--line)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.big.pot{color:var(--money)}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.meter{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--money);border-radius:99px;transition:width .3s}
.meter .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.meter .row b{font-weight:700}
.payinfo{margin:0 18px 14px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.payinfo span{font-weight:600;min-width:0;overflow-wrap:anywhere}
.payinfo button{padding:6px 12px;font-size:13px;background:var(--surface);border-color:var(--line);color:var(--ink)}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
section.block h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.place{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.place .amt{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--gold)}
.place .who{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
ul.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:right}
.pname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;align-items:center}
.paid{white-space:nowrap;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.paid.on{background:var(--money-soft);color:var(--money);border-color:transparent}
.acts select{font:600 13px var(--body);padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.x{padding:6px 9px;font-size:13px;background:transparent;border-color:var(--line);color:var(--muted)}
.add{display:flex;gap:8px}
input,select{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.add input{flex:1}
.add button{flex:none}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
form.grid .full{grid-column:1/-1}
.formacts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-size:17px}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
@media (max-width:359px){.hero{grid-template-columns:1fr}.hero>div+div{border-left:0;border-top:1px dashed var(--line)}form.grid{grid-template-columns:1fr}}
#main{display:flex;flex-direction:column;gap:16px}
@media (max-width:420px){form.grid{grid-template-columns:1fr}}
.places{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.winner{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.winner:first-of-type{border-top:0}
.payrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paybtn{display:inline-flex;align-items:center;justify-content:center;background:var(--money);color:var(--on-money);font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:15px}
.paybtn:focus-visible{outline:3px solid var(--money);outline-offset:2px}
button.small{padding:8px 10px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--money);font:inherit;text-decoration:underline;cursor:pointer}
.hform select,.join select{flex:none;width:auto}
.join{display:flex;flex-direction:column;gap:8px}
:root{--silver-t:#626b76;--gold-1:#f6d36b;--gold-2:#c8911a;--silver-1:#eef1f4;--silver-2:#9aa3ad;--bronze-1:#e7a877;--bronze-2:#a5592a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--silver-t:#c7ced6}}
:root[data-theme="dark"]{--silver-t:#c7ced6}
.num.medal{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1d1503;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.25)}
.num.medal.gold{background:radial-gradient(circle at 35% 30%,var(--gold-1),var(--gold-2))}
.num.medal.silver{background:radial-gradient(circle at 35% 30%,var(--silver-1),var(--silver-2))}
.num.medal.bronze{background:radial-gradient(circle at 35% 30%,var(--bronze-1),var(--bronze-2))}
.roster li.won small{font-weight:700}
.roster li.gold small{color:var(--gold-2)} .roster li.silver small{color:var(--silver-t)} .roster li.bronze small{color:var(--bronze-2)}
.place.gold{border-color:var(--gold-2);background:linear-gradient(160deg,color-mix(in srgb,var(--gold-1) 30%,var(--surface2)),var(--surface2) 60%)}
.place.silver{border-color:var(--silver-2);background:linear-gradient(160deg,color-mix(in srgb,var(--silver-1) 35%,var(--surface2)),var(--surface2) 60%)}
.place.bronze{border-color:var(--bronze-2);background:linear-gradient(160deg,color-mix(in srgb,var(--bronze-1) 30%,var(--surface2)),var(--surface2) 60%)}
.place.gold .amt{color:var(--gold-2)} .place.silver .amt{color:var(--silver-t)} .place.bronze .amt{color:var(--bronze-2)}
.pts{width:58px;flex:none;padding:6px 6px;font-size:14px;text-align:center}
.ptsv{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.autonote{font-size:13px;color:var(--muted);margin:0}
details.terms{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
details.terms summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
details.terms summary::-webkit-details-marker{display:none}
details.terms .tt{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
details.terms .tt::after{content:" +";color:var(--muted)}
details.terms[open] .tt::after{content:" –"}
details.terms ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;max-width:62ch}
details.terms li b{font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.agree input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--money)}
.agreed{font-size:12px;color:var(--money);font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);min-width:0}
.pick .pn{font-weight:700;overflow-wrap:anywhere}
.pick .who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pick.gone .pn{color:var(--muted)}
.pick.gold{border-color:var(--gold-2);background:linear-gradient(160deg,color-mix(in srgb,var(--gold-1) 30%,var(--surface2)),var(--surface2) 60%)}
.pick.gold .pn{color:var(--gold-2)}
.winpick{display:flex;flex-direction:column;gap:5px}
.pname .pk{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pname select.pksel{margin-top:4px;font-size:13px;padding:4px 6px;width:auto;max-width:100%}
textarea{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
form.grid label.chk{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:10px}
form.grid label.chk input{width:20px;height:20px;flex:none;accent-color:var(--money)}
.add{flex-wrap:wrap}
.add input{flex:1 1 160px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="siteName"><a href="./" style="color:inherit;text-decoration:none">Pool Board</a></h1>
      <p class="sub" id="who">Buy-ins, who's in, and what the pot pays out.</p>
    </div>
    <button class="ghost" id="outBtn" hidden>Log out</button>
  </div>
  <div id="main"><div class="empty"><strong>Loading…</strong></div></div>
  <div class="status" id="status" role="status"></div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const CFG=window.POOL_CONFIG||{};
const SB=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
if(CFG.SITE_NAME){document.title=CFG.SITE_NAME;$('siteName').firstChild.textContent=CFG.SITE_NAME;}
const PRESETS=[{k:'100',label:'Winner takes all',s:[100]},{k:'70-30',label:'Top 2 · 70 / 30',s:[70,30]},{k:'60-30-10',label:'Top 3 · 60 / 30 / 10',s:[60,30,10]},{k:'50-30-20',label:'Top 3 · 50 / 30 / 20',s:[50,30,20]}];
const ORD=['1st','2nd','3rd'];
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}).format(n);
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='text')e.textContent=v;else if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}for(const c of [].concat(kids))if(c)e.append(c);return e;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COLS='id,pool_id,name,paid,place,paid_out,score,pick,agreed_at,created_at';
const APPS={venmo:{label:'Venmo',pre:'@'},cashapp:{label:'Cash App',pre:'$'}};
const cleanHandle=h=>String(h||'').trim().replace(/^[@$]+/,'').replace(/\s+/g,'');
const okHandle=h=>/^[A-Za-z0-9_-]{1,30}$/.test(h);
function payLink(app,handle,amt,note){const a=amt.toFixed(2);
  if(app==='cashapp')return 'https://cash.app/$'+encodeURIComponent(handle)+'/'+a;
  return 'https://venmo.com/?txn=pay&audience=private&recipients='+encodeURIComponent(handle)+'&amount='+a+'&note='+encodeURIComponent(note);}
function handleFields(idp,app,handle){
  return [el('select',{id:idp+'App','aria-label':'Payment app'},Object.entries(APPS).map(([k,v])=>el('option',{value:k,text:v.label,selected:k===(app||'venmo')}))),
          el('input',{id:idp+'Handle',placeholder:'Username',maxlength:'31',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Payment username',value:handle||''})];
}
function readHandle(idp){const app=$(idp+'App').value,h=cleanHandle($(idp+'Handle').value);return {app,h};}
// list: [{key,name,place,payApp,payHandle,paidOut}], save(item,patch) with camelCase patch keys
const hasScore=x=>x.score!==null&&x.score!==undefined&&x.score!==''&&isFinite(+x.score);
// Points decide places automatically: highest score is 1st; ties share a place (and split its prize).
function applyRanking(list,nPlaces,low){
  const scored=list.filter(hasScore);if(!scored.length)return false;
  const vals=[...new Set(scored.map(x=>+x.score))].sort((a,b)=>low?a-b:b-a);
  list.forEach(x=>{if(!hasScore(x)){x.place=0;return;}const r=vals.indexOf(+x.score)+1;x.place=r<=nPlaces?r:0;});
  return true;
}
const MEDAL=['gold','silver','bronze'];
function rosterList(list,pays,org,splits,auto,h,low,pk){
  const order=list.map((x,i)=>({x,i})).sort((a,b)=>{const pa=a.x.place||99,pb=b.x.place||99;if(pa!==pb)return pa-pb;const none=low?Infinity:-Infinity,sa=hasScore(a.x)?+a.x.score:none,sb=hasScore(b.x)?+b.x.score:none;if(sa!==sb)return low?sa-sb:sb-sa;return a.i-b.i;});
  return el('ul',{class:'roster'},order.map(({x},i)=>{
    const acts=el('div',{class:'acts'});
    if(org){
      acts.append(el('button',{class:'paid'+(x.paid?' on':''),'aria-pressed':String(!!x.paid),text:x.paid?'Paid':'Not paid',onclick:()=>h.paid(x)}));
      acts.append(el('input',{class:'pts',type:'number',inputmode:'decimal',step:'any',placeholder:'Pts','aria-label':'Points for '+x.name,value:hasScore(x)?String(+x.score):'',onchange:e=>{const v=e.target.value.trim();h.score(x,v===''?null:+v);}}));
      if(!auto)acts.append(el('select',{'aria-label':'Finish for '+x.name,onchange:e=>h.place(x,+e.target.value||0)},[el('option',{value:'0',text:'—'}),...splits.map((_,j)=>el('option',{value:String(j+1),text:ORD[j],selected:x.place===j+1}))]));
      acts.append(el('button',{class:'x','aria-label':'Remove '+x.name,text:'✕',onclick:()=>h.remove(x)}));
    }else{
      if(hasScore(x))acts.append(el('span',{class:'ptsv',text:(+x.score)+' pts'}));
      acts.append(el('span',{class:'paid'+(x.paid?' on':''),text:x.paid?'Paid':'Not paid'}));
    }
    const pl=x.place&&pays[x.place-1]?x.place:0;
    const tied=pl?list.filter(y=>y.place===pl).length:1;
    const win=pl?ORD[pl-1]+' place · wins '+fmt(Math.round(pays[pl-1].amt/tied*100)/100):null;
    const badge=pl?el('span',{class:'num medal '+MEDAL[pl-1],title:ORD[pl-1]+' place',text:String(pl)}):el('span',{class:'num',text:String(i+1)});
    return el('li',{class:pl?'won '+MEDAL[pl-1]:''},[badge,el('span',{class:'pname'},[x.name,pk&&pk.picks.length?(org?(()=>{const s=pickSelect('pk'+x.key,pk,list,x.pick||'','Pick '+pk.label.toLowerCase());s.className='pksel';s.addEventListener('change',e=>h.pick(x,e.target.value));return s;})():el('span',{class:'pk',text:pk.label+': '+(x.pick||'—')})):null,win?el('small',{text:win}):null]),acts]);
  }));
}
// Pool Terms – Promise to Pay. c = {name, buyIn, payTo, splits, low}
function termsItems(c){
  const split=c.splits.length===1?'Winner takes the whole pot.':'The pot is split '+c.splits.map((s,i)=>s+'% to '+ORD[i]+' place').join(', ')+'.';
  return [
    ['Buy-in','Each player promises to pay the '+fmt(c.buyIn)+' buy-in to the organizer'+(c.payTo?' ('+c.payTo+')':'')+' before the game starts. A player who hasn\'t paid by then can be removed and can\'t win a prize.'],
    ['The pot','Every buy-in goes into the pot. The organizer keeps no cut: all the money collected is paid out to the winners.'],
    ['Prizes',split+' Places are set by the scores the organizer posts on this page, and the '+(c.low?'lowest':'highest')+' score wins. '+(c.pickLabel?' If the organizer posts a winning '+c.pickLabel.toLowerCase()+', everyone who picked it shares 1st place instead.':'')+' Players tied for a place split that place\'s prize equally.'],

    el('label',{},['Max players (optional)',el('input',{id:'fMax',type:'number',inputmode:'numeric',min:'2',step:'1',placeholder:'No limit',value:p&&p.max_players?String(p.max_players):''})]),
    ...pickFields(p),
    el('label',{class:'full'},['Who wins',el('select',{id:'fLow'},[el('option',{value:'0',text:'Highest score wins',selected:!(p&&p.low_wins)}),el('option',{value:'1',text:'Lowest score wins (like golf)',selected:!!(p&&p.low_wins)})])]),
    el('label',{class:'full'},['How the pot pays out',el('select',{id:'fSplit'},PRESETS.map(x=>el('option',{value:x.k,text:x.label,selected:x.k===curK})))]),
    el('label',{class:'full'},['Where to send money (optional)',el('input',{id:'fPay',maxlength:'80',placeholder:'Venmo @yourname or Cash App $yourname',value:p&&p.pay_info?p.pay_info:''})]),
    el('div',{class:'formacts'},[el('button',{type:'button',class:'ghost',text:'Cancel',onclick:()=>{mode='view';render();}}),el('button',{type:'submit',class:'primary',text:p?'Save changes':'Create pool'})]));
  f.addEventListener('submit',async e=>{e.preventDefault();
    const row={name:$('fName').value.trim(),buy_in:Math.round(parseFloat($('fBuy').value)*100)/100,max_players:parseInt($('fMax').value,10)||null,splits:PRESETS.find(x=>x.k===$('fSplit').value).s,pay_info:$('fPay').value.trim()||null,low_wins:$('fLow').value==='1'};const pk=readPickFields();row.picks=pk.picks;row.pick_label=pk.label;row.unique_picks=pk.unique;if(p&&!pk.picks.includes(p.winningPick))row.winning_pick=null;
    if(!row.name||!(row.buy_in>0)){status('Give the pool a name and a buy-in above $0.',true);return;}
    status('Saving…');
    if(p){const r=await SB.from('bp_pools').update(row).eq('id',p.id);if(r.error){status(friendly(r.error),true);return;}
      const drop=entries.filter(x=>x.place>row.splits.length);for(const x of drop)await SB.from('bp_entries').update({place:0}).eq('id',x.id);
      mode='view';await loadPool();}
    else{const r=await SB.from('bp_pools').insert({...row,organizer_id:me.id}).select().single();if(r.error){status(friendly(r.error),true);return;}location.href='?pool='+r.data.id;}
  });
  setTimeout(()=>{const i=$('fName');if(i)i.focus();},0);
  return el('div',{class:'slip',style:'padding:18px'},[el('h2',{text:p?'Edit pool':'New pool',style:'font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 14px;text-transform:uppercase'}),f]);
}

$('outBtn').addEventListener('click',async()=>{await SB.auth.signOut();});

async function start(){
  if(!SB){render();return;}
  const {data}=await SB.auth.getSession();me=data.session?data.session.user:null;
  SB.auth.onAuthStateChange((ev,s)=>{const was=me&&me.id;me=s?s.user:null;if((me&&me.id)!==was){mode='view';if(poolId)render();else if(me)loadMine();else render();}});
  if(poolId){await loadPool();
    // keep the pot live while the page is open
    timer=setInterval(()=>{if(document.visibilityState==='visible'&&mode==='view')loadPool(true);},10000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadPool(true);});
  }else if(me)await loadMine();else render();
  $('who').textContent=poolId?'Live pool. Refreshes every few seconds.':'Buy-ins, who\'s in, and what the pot pays out.';
}
start();
})();
</script>
</body>
</html>
