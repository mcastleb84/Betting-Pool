<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool Board</title>
<meta name="theme-color" content="#17784a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pool Board">
<meta name="description" content="Betting pools with friends: buy-ins, who's in, the pot, payouts and game chat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column "pool slip" — pool tabs on top, the two numbers people ask about (pot + buy-in) as the hero, then payouts, then the roster. */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface2:#f6f8f4; --ink:#14211a; --muted:#5b6a61; --line:#d9e0d8;
  --money:#17784a; --money-soft:#e2f2e8; --gold:#b97a08; --gold-soft:#fbf0d9; --warn:#b3412c; --warn-soft:#f9e5e0; --on-money:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --surface2:#1b2720; --ink:#edf2ec; --muted:#98a89e; --line:#28362d;
  --money:#46c784; --money-soft:#173426; --gold:#f2b33d; --gold-soft:#33290f; --warn:#f08a74; --warn-soft:#3a1d17; --on-money:#06140c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --surface2:#1b2720; --ink:#edf2ec; --muted:#98a89e; --line:#28362d;
  --money:#46c784; --money-soft:#173426; --gold:#f2b33d; --gold-soft:#33290f; --warn:#f08a74; --warn-soft:#3a1d17; --on-money:#06140c; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
a{color:var(--money)}
.auth{display:flex;flex-direction:column;gap:10px}
.auth .row2{display:flex;gap:8px;flex-wrap:wrap}
.sso{display:flex;flex-direction:column;gap:8px}
.sso button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;font-size:16px}
.sso svg{width:20px;height:20px;flex:none}
.sso .g{background:#fff;color:#1f1f1f;border-color:#747775}
.sso .a{background:#000;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sso .a{background:#fff;color:#000}}
:root[data-theme="dark"] .sso .a{background:#fff;color:#000}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{font-size:14px}
.linkbox button{flex:none;white-space:nowrap}
.mine{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mine li{border-top:1px solid var(--line)}
.mine li:first-child{border-top:0}
.mine a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;color:var(--ink);text-decoration:none;font-weight:600}
.mine a span:last-child{color:var(--money);font-variant-numeric:tabular-nums}
.you{padding:10px 12px;border-radius:10px;background:var(--money-soft);color:var(--money);font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:600 15px var(--body);cursor:pointer;border-radius:10px;border:1px solid transparent;padding:10px 16px;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--money);outline-offset:2px}
.primary{background:var(--money);color:var(--on-money)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.danger{background:var(--warn-soft);color:var(--warn)}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.slip-head{padding:16px 18px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.slip-head h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--money-soft);color:var(--money)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.hero>div{padding:14px 18px;min-width:0}
.hero>div+div{border-left:1px dashed var(--line)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.big.pot{color:var(--money)}
.note{font-size:13px;color:var(--muted);margin-top:4px}
.meter{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--money);border-radius:99px;transition:width .3s}
.meter .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.meter .row b{font-weight:700}
.payinfo{margin:0 18px 14px;padding:10px 12px;border-radius:10px;background:var(--gold-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.payinfo span{font-weight:600;min-width:0;overflow-wrap:anywhere}
.payinfo button{padding:6px 12px;font-size:13px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.paybox{margin:0 18px 14px;padding:12px;border-radius:12px;background:var(--gold-soft);display:flex;flex-direction:column;gap:8px}
.payways{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.payway{display:flex;flex-direction:column;gap:1px;text-decoration:none;border-radius:10px;padding:10px 12px;color:#fff;min-width:0}
.payway b{font-size:16px;font-weight:700}.payway span{font-size:12px;opacity:.9;overflow-wrap:anywhere}
.payway.paypal{background:#003087}.payway.cashapp{background:#00a046}.payway.venmo{background:#0074de}
.payway:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.payother{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600;overflow-wrap:anywhere}
.payother button{padding:6px 12px;font-size:13px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.sentbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.sentbox .payrow button{padding:8px 12px;font-size:14px}
.roster small.sent{color:var(--gold);font-weight:700}
.paywin{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.paywin:first-of-type{border-top:0;padding-top:0}
.paywin .wh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.paywin .wh b{font-family:var(--display);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
section.block.winbox{border-color:var(--gold);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 70%)}
section.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
section.block h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.place{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.place .amt{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--gold)}
.place .who{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
ul.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.roster li:first-child{border-top:0}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:right}
.pname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;align-items:center}
.paid{white-space:nowrap;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.paid.on{background:var(--money-soft);color:var(--money);border-color:transparent}
.acts select{font:600 13px var(--body);padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.x{padding:6px 9px;font-size:13px;background:transparent;border-color:var(--line);color:var(--muted)}
.add{display:flex;gap:8px}
input,select{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.add input{flex:1}
.add button{flex:none}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
form.grid .full{grid-column:1/-1}
.formacts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-size:17px}
.status{font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
@media (max-width:359px){.hero{grid-template-columns:1fr}.hero>div+div{border-left:0;border-top:1px dashed var(--line)}form.grid{grid-template-columns:1fr}}
#main{display:flex;flex-direction:column;gap:16px}
@media (max-width:420px){form.grid{grid-template-columns:1fr}}
.places{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.winner{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.winner:first-of-type{border-top:0}
.payrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paybtn{display:inline-flex;align-items:center;justify-content:center;background:var(--money);color:var(--on-money);font-weight:700;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:15px}
.paybtn:focus-visible{outline:3px solid var(--money);outline-offset:2px}
button.small{padding:8px 10px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--money);font:inherit;text-decoration:underline;cursor:pointer}
.hform select,.join select{flex:none;width:auto}
.join{display:flex;flex-direction:column;gap:8px}
:root{--silver-t:#626b76;--gold-1:#f6d36b;--gold-2:#c8911a;--silver-1:#eef1f4;--silver-2:#9aa3ad;--bronze-1:#e7a877;--bronze-2:#a5592a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--silver-t:#c7ced6}}
:root[data-theme="dark"]{--silver-t:#c7ced6}
.num.medal{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1d1503;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.25)}
.num.medal.gold{background:radial-gradient(circle at 35% 30%,var(--gold-1),var(--gold-2))}
.num.medal.silver{background:radial-gradient(circle at 35% 30%,var(--silver-1),var(--silver-2))}
.num.medal.bronze{background:radial-gradient(circle at 35% 30%,var(--bronze-1),var(--bronze-2))}
.roster li.won small{font-weight:700}
.roster li.gold small{color:var(--gold-2)} .roster li.silver small{color:var(--silver-t)} .roster li.bronze small{color:var(--bronze-2)}
.place.gold{border-color:var(--gold-2);background:linear-gradient(160deg,color-mix(in srgb,var(--gold-1) 30%,var(--surface2)),var(--surface2) 60%)}
.place.silver{border-color:var(--silver-2);background:linear-gradient(160deg,color-mix(in srgb,var(--silver-1) 35%,var(--surface2)),var(--surface2) 60%)}
.place.bronze{border-color:var(--bronze-2);background:linear-gradient(160deg,color-mix(in srgb,var(--bronze-1) 30%,var(--surface2)),var(--surface2) 60%)}
.place.gold .amt{color:var(--gold-2)} .place.silver .amt{color:var(--silver-t)} .place.bronze .amt{color:var(--bronze-2)}
.pts{width:58px;flex:none;padding:6px 6px;font-size:14px;text-align:center}
.ptsv{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.autonote{font-size:13px;color:var(--muted);margin:0}
details.terms{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
details.terms summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
details.terms summary::-webkit-details-marker{display:none}
details.terms .tt{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
details.terms .tt::after{content:" +";color:var(--muted)}
details.terms[open] .tt::after{content:" –"}
details.terms ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;max-width:62ch}
details.terms li b{font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.agree input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--money)}
.agreed{font-size:12px;color:var(--money);font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);min-width:0}
.pick .pn{font-weight:700;overflow-wrap:anywhere}
.pick .who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pick.gone .pn{color:var(--muted)}
.pick.gold{border-color:var(--gold-2);background:linear-gradient(160deg,color-mix(in srgb,var(--gold-1) 30%,var(--surface2)),var(--surface2) 60%)}
.pick.gold .pn{color:var(--gold-2)}
.winpick{display:flex;flex-direction:column;gap:5px}
.pname .pk{display:block;font-size:12px;color:var(--muted);font-weight:600}
.pname select.pksel{margin-top:4px;font-size:13px;padding:4px 6px;width:auto;max-width:100%}
textarea{font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
form.grid label.chk{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:10px}
form.grid label.chk input{width:20px;height:20px;flex:none;accent-color:var(--money)}
.add{flex-wrap:wrap}
.add input{flex:1 1 160px}
.chooserwrap{display:flex;flex-direction:column;gap:6px;width:100%}
.chooser{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600}
.opt[aria-pressed="true"]{background:var(--money);color:var(--on-money);border-color:var(--money)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.pkedit{display:block}
.pkpanel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pkpanel .primary{align-self:flex-start}
.namebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.namebox{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.topacts{display:flex;gap:8px;flex-wrap:wrap}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.navbar button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px}
.navbar .sp{flex:1}
#refreshBtn.spin .ic{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refreshBtn.spin .ic{animation:none}}
.collect{display:flex;flex-direction:column;gap:0}
.crow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.crow .wh{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.crow small{color:var(--gold);font-weight:700}
.crow .payrow a,.crow .payrow button{padding:7px 12px;font-size:14px}

.deadline{margin:0 18px 14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.deadline b{font-size:16px}
.deadline .rel{margin-left:auto;font-size:13px;font-weight:700;color:var(--money)}
.deadline.soon .rel{color:var(--gold)}
.deadline.over{border-color:var(--warn);background:var(--warn-soft)}
.deadline.over .rel{color:var(--warn)}
.dlbox{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.dlbox .payrow button{padding:7px 12px;font-size:14px}
.dlbox input{max-width:260px}
a.ghostlink{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.tov{position:fixed;inset:0;z-index:1000;background:transparent}
.tov.dim{background:rgba(0,0,0,.6)}
.thl{position:fixed;z-index:1001;border-radius:14px;box-shadow:0 0 0 3px var(--money),0 0 0 9999px rgba(0,0,0,.6);pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s}
.tcard{position:fixed;z-index:1002;left:50%;width:calc(100% - 32px);max-width:400px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}
.tcard h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;text-transform:uppercase;line-height:1.1}
.tcard p{margin:0;font-size:15px;line-height:1.45}
.tbtns{display:flex;gap:8px;align-items:center;margin-top:8px}
.tsp{flex:1}
@media (prefers-reduced-motion:reduce){.thl{transition:none}}
.sports{gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sports .tab{font:700 15px var(--body);padding:10px 16px;display:inline-flex;gap:7px;align-items:center}
.tab .ct{font-size:12px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--muted);text-align:center}
.tab[aria-pressed="true"] .ct{background:var(--money);color:var(--on-money)}
.sportnote{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.sportnote b{color:var(--ink)}
.teampick{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thead .lbl{margin-right:auto}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface2)}
@media (max-width:420px){.tgrid{grid-template-columns:1fr}}
form.grid label.tchk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:500;padding:8px 0;cursor:pointer}
form.grid label.tchk input{width:20px;height:20px;flex:none;accent-color:var(--money)}
.tsel{display:flex;flex-direction:column;gap:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--money-soft);color:var(--money)}
.iosinstall{background:var(--surface);border:1px solid var(--money);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.iosinstall ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.iosinstall button{align-self:flex-start}
/* Game chat: floating button + bottom sheet, kept outside #main so live refreshes never wipe a half-typed message. */
body.haschat .wrap{padding-bottom:96px}
.chatfab{position:fixed;z-index:900;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 18px;font:700 15px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.chatfab .badge{min-width:22px;padding:1px 7px;border-radius:99px;background:var(--money);color:var(--on-money);font-size:12px;text-align:center}
.chatsheet{position:fixed;z-index:950;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:min(72vh,560px);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.chatsheet{left:auto;transform:none;right:24px;bottom:24px;width:380px;border-bottom:1px solid var(--line);border-radius:18px}}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.chathead h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.chathead .pn{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chathead>div{flex:1;min-width:0}
.chatlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.msg{max-width:82%;align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--money-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.msg .mh{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.msg .mh b{color:var(--ink);font-weight:700}
.msg .mt{font-size:15px;line-height:1.4;white-space:pre-wrap}
.msg .del{margin-left:auto;background:none;border:0;padding:0 2px;font-size:12px;color:var(--muted)}
.chatempty{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:26ch}
.chatform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0}
.chatnote{padding:0 14px 8px;font-size:12px;color:var(--warn)}
.chatnote:empty{display:none}
</style>

<div class="wrap">
  <nav class="navbar" aria-label="Page"><button class="ghost" id="backBtn" hidden><span aria-hidden="true">←</span> Back</button><span class="sp"></span><button class="ghost" id="refreshBtn"><span class="ic" aria-hidden="true">↻</span> Refresh</button></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const CFG=window.POOL_CONFIG||{};
const SB=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
if(CFG.SITE_NAME){document.title=CFG.SITE_NAME;$('siteName').firstChild.textContent=CFG.SITE_NAME;}
const PRESETS=[{k:'100',label:'Winner takes all',s:[100]},{k:'70-30',label:'Top 2 · 70 / 30',s:[70,30]},{k:'60-30-10',label:'Top 3 · 60 / 30 / 10',s:[60,30,10]},{k:'50-30-20',label:'Top 3 · 50 / 30 / 20',s:[50,30,20]}];
const ORD=['1st','2nd','3rd'];
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}).format(n);
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='text')e.textContent=v;else if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}for(const c of [].concat(kids))if(c)e.append(c);return e;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COLS0='id,pool_id,name,paid,place,paid_out,score,pick,chosen,agreed_at,created_at';let COLS=COLS0+',sent_via';
const APPS={venmo:{label:'Venmo',pre:'@'},cashapp:{label:'Cash App',pre:'$'},paypal:{label:'PayPal',pre:'paypal.me/'}};
const PAY_ORDER=['paypal','cashapp','venmo'],SENT_LABEL={paypal:'PayPal',cashapp:'Cash App',venmo:'Venmo',other:'another way'};
const cleanHandle=h=>String(h||'').trim().replace(/^(https?:\/\/)?(www\.)?(paypal\.me|paypal\.com\/paypalme|cash\.app|venmo\.com)\/+/i,'').replace(/^[@$]+/,'').replace(/[\/?#].*$/,'').replace(/\s+/g,'');
const okHandle=h=>/^[A-Za-z0-9_-]{1,30}$/.test(h);
function payLink(app,handle,amt,note){const a=amt.toFixed(2);
  if(app==='cashapp')return 'https://cash.app/$'+encodeURIComponent(handle)+'/'+a;
  if(app==='paypal')return 'https://paypal.me/'+encodeURIComponent(handle)+'/'+a+'USD';
  return 'https://venmo.com/?txn=pay&audience=private&recipients='+encodeURIComponent(handle)+'&amount='+a+'&note='+encodeURIComponent(note);}
function handleFields(idp,app,handle){
  return [el('select',{id:idp+'App','aria-label':'Payment app'},Object.entries(APPS).map(([k,v])=>el('option',{value:k,text:v.label,selected:k===(app||'venmo')}))),
          el('input',{id:idp+'Handle',placeholder:'Username',maxlength:'31',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':'Payment username',value:handle||''})];
}
// Buy-in: one button per app the organizer takes (h = {paypal,cashapp,venmo}); each opens the app with the amount filled in.
const payWays=h=>PAY_ORDER.filter(k=>h&&h[k]);
const payToText=(h,other)=>payWays(h).map(k=>APPS[k].label+' '+APPS[k].pre+h[k]).concat(other?[other]:[]).join(', ');
function payBox(h,amt,note,other,copy){
  const ways=payWays(h);if(!ways.length&&!other)return null;
  return el('div',{class:'paybox'},[el('div',{class:'lbl',text:'Pay the '+fmt(amt)+' buy-in'}),
    ways.length?el('div',{class:'payways'},ways.map(k=>el('a',{class:'payway '+k,href:payLink(k,h[k],amt,note),target:'_blank',rel:'noopener','aria-label':'Pay '+fmt(amt)+' with '+APPS[k].label},[el('b',{text:APPS[k].label}),el('span',{text:APPS[k].pre+h[k]})]))):null,
    other?el('div',{class:'payother'},[el('span',{text:(ways.length?'Or: ':'Pay to: ')+other}),copy?copy(other):null]):null]);
}
// After paying, the player says which app they used; the organizer checks it arrived and taps Paid.
function sentBox(x,h,other,onSent){
  if(x.paid)return el('div',{class:'you',text:'Your buy-in is marked paid. You\'re all set.'});
  if(x.sentVia)return el('div',{class:'sentbox'},[el('span',{text:'You said you sent it on '+SENT_LABEL[x.sentVia]+'. The organizer will mark you paid once it arrives.'}),el('div',{},[el('button',{type:'button',class:'linkish',text:'I haven\'t sent it yet',onclick:()=>onSent(null)})])]);
  const opts=payWays(h).concat(other||!payWays(h).length?['other']:[]);
  return el('div',{class:'sentbox'},[el('span',{text:'Sent your buy-in? Tap the app you used so the organizer knows to look for it.'}),
    el('div',{class:'payrow'},opts.map(k=>el('button',{type:'button',class:'ghost',text:k==='other'?'I paid another way':'I paid with '+APPS[k].label,onclick:()=>onSent(k)})))]);
}
function readHandle(idp){const app=$(idp+'App').value,h=cleanHandle($(idp+'Handle').value);return {app,h};}
// list: [{key,name,place,payApp,payHandle,paidOut}], save(item,patch) with camelCase patch keys
const hasScore=x=>x.score!==null&&x.score!==undefined&&x.score!==''&&isFinite(+x.score);
// Points decide places automatically: highest score is 1st; ties share a place (and split its prize).
function applyRanking(list,nPlaces,low){
  const scored=list.filter(hasScore);if(!scored.length)return false;
  const vals=[...new Set(scored.map(x=>+x.score))].sort((a,b)=>low?a-b:b-a);
  list.forEach(x=>{if(!hasScore(x)){x.place=0;return;}const r=vals.indexOf(+x.score)+1;x.place=r<=nPlaces?r:0;});
  return true;
}
const MEDAL=['gold','silver','bronze'];
function rosterList(list,pays,org,splits,auto,h,low,pk){
  const order=list.map((x,i)=>({x,i})).sort((a,b)=>{const pa=a.x.place||99,pb=b.x.place||99;if(pa!==pb)return pa-pb;const none=low?Infinity:-Infinity,sa=hasScore(a.x)?+a.x.score:none,sb=hasScore(b.x)?+b.x.score:none;if(sa!==sb)return low?sa-sb:sb-sa;return a.i-b.i;});
  return el('ul',{class:'roster'},order.map(({x},i)=>{
    const acts=el('div',{class:'acts'});
    if(org){
      acts.append(el('button',{class:'paid'+(x.paid?' on':''),'aria-pressed':String(!!x.paid),text:x.paid?'Paid':'Not paid',onclick:()=>h.paid(x)}));
      acts.append(el('input',{class:'pts',type:'number',inputmode:'decimal',step:'any',placeholder:'Pts','aria-label':'Points for '+x.name,value:hasScore(x)?String(+x.score):'',onchange:e=>{const v=e.target.value.trim();h.score(x,v===''?null:+v);}}));
      if(!auto)acts.append(el('select',{'aria-label':'Finish for '+x.name,onchange:e=>h.place(x,+e.target.value||0)},[el('option',{value:'0',text:'—'}),...splits.map((_,j)=>el('option',{value:String(j+1),text:ORD[j],selected:x.place===j+1}))]));
      acts.append(el('button',{class:'x','aria-label':'Remove '+x.name,text:'✕',onclick:()=>h.remove(x)}));
    }else{
      if(hasScore(x))acts.append(el('span',{class:'ptsv',text:(+x.score)+' pts'}));
      acts.append(el('span',{class:'paid'+(x.paid?' on':''),text:x.paid?'Paid':'Not paid'}));
    }
    const pl=x.place&&pays[x.place-1]?x.place:0;
    const tied=pl?list.filter(y=>y.place===pl).length:1;
    const win=pl?ORD[pl-1]+' place · wins '+fmt(Math.round(pays[pl-1].amt/tied*100)/100):null;
    const badge=pl?el('span',{class:'num medal '+MEDAL[pl-1],title:ORD[pl-1]+' place',text:String(pl)}):el('span',{class:'num',text:String(i+1)});
    return el('li',{class:pl?'won '+MEDAL[pl-1]:''},[badge,el('span',{class:'pname'},[x.name,pickCell(x,pk,org,list,h),!x.paid&&x.sentVia?el('small',{class:'sent',text:'Says sent on '+SENT_LABEL[x.sentVia]+(org?' · check, then tap Paid':' · waiting on organizer')}):null,win?el('small',{text:win}):null]),acts]);
  }));
}
// Pool Terms – Promise to Pay. c = {name, buyIn, payTo, splits, low}
function termsItems(c){
  const split=c.splits.length===1?'Winner takes the whole pot.':'The pot is split '+c.splits.map((s,i)=>s+'% to '+ORD[i]+' place').join(', ')+'.';
  return [
    ['Buy-in','Each player promises to pay the '+fmt(c.buyIn)+' buy-in to the organizer'+(c.payTo?' ('+c.payTo+')':'')+(c.payBy?' by '+fmtWhen(c.payBy):' before the game starts')+'. A player who hasn\'t paid by then can be removed and can\'t win a prize.'],
    ['The pot','Every buy-in goes into the pot. The organizer keeps no cut: all the money collected is paid out to the winners.'],
    ['Prizes',split+' Places are set by the scores the organizer posts on this page, and the '+(c.low?'lowest':'highest')+' score wins. '+(c.pickLabel?' Each player picks '+nOf(c.each||1,c.pickLabel)+'. If the organizer posts a winning '+c.pickLabel.toLowerCase()+', everyone who picked it shares 1st place instead.':'')+' Players tied for a place split that place\'s prize equally.'],
    ['When victory is confirmed','A win is confirmed once the game is final and the organizer posts the final scores here. Anyone in the pool has 24 hours after that to point out a mistake to the organizer. After 24 hours, the results are final.'],
    ['Promise to pay the winners','Once victory is confirmed, the organizer promises to pay each winner their full prize within 48 hours, to the PayPal, Cash App or Venmo username the winner gave, and to mark it "Paid out" on this page.'],
    ['If the pool is canceled','If the game is canceled or the pool can\'t be decided, the organizer returns every buy-in in full within 48 hours.'],
    ['Fair play','One entry per person unless the organizer allows more. Scores come only from the official game result.'],
    ['Who can join','You must be 18 or older, and betting pools must be allowed where you live.'],
    ['A personal agreement','This is an agreement between the people in this pool. This website, PayPal, Cash App and Venmo are only tools. They don\'t hold the money or guarantee any payment.'],
  ];

function termsView(c,open){
  const d=el('details',{class:'terms block',id:'terms',open:!!open},[
    el('summary',{},[el('span',{class:'tt',text:'Pool terms · Promise to pay'}),el('span',{class:'note',text:'By joining '+c.name+', every player and the organizer agree to these terms.'})]),
    el('ol',{},termsItems(c).map(([h,b])=>el('li',{},[el('b',{text:h+'. '}),b])))]);

// Picks: the organizer sets how many teams are in the pool, names them, and sets how many each player must pick.
const cleanPicks=a=>[...new Set((Array.isArray(a)?a:String(a||'').split('\n')).map(s=>String(s).trim().slice(0,40)).filter(Boolean))].slice(0,200);
const chosenOf=x=>Array.isArray(x.chosen)&&x.chosen.length?x.chosen:(x.pick?[x.pick]:[]);
const plural=s=>/s$/i.test(s)?s:s+'s';
const nOf=(n,label)=>n+' '+(n===1?label:plural(label)).toLowerCase();
function applyPicks(list,win){list.forEach(x=>{x.place=chosenOf(x).includes(win)?1:0;});return true;}
function takenSet(k,list,exceptKey){return new Set(k.unique?list.filter(x=>x.key!==exceptKey).flatMap(chosenOf):[]);}
// One-pick pools get a dropdown; multi-pick pools get tap-to-choose buttons limited to k.each.
function pickChooser(id,k,list,exceptKey,current,blank){
  const need=k.each||1,taken=takenSet(k,list,exceptKey);
  if(need===1){const s=el('select',{id,'aria-label':k.label},[el('option',{value:'',text:blank}),...k.picks.map(v=>el('option',{value:v,text:v+(taken.has(v)?' (taken)':''),disabled:taken.has(v),selected:current[0]===v}))]);return {node:s,value:()=>s.value?[s.value]:[]};}
  const sel=new Set(current.filter(v=>k.picks.includes(v)));
  const count=el('div',{class:'lbl'}),box=el('div',{class:'chooser',id,role:'group','aria-label':'Choose '+nOf(need,k.label)});
  const btns=k.picks.map(v=>{const b=el('button',{type:'button',class:'opt',text:v+(taken.has(v)?' (taken)':'')});b.addEventListener('click',()=>{if(sel.has(v))sel.delete(v);else if(sel.size<need)sel.add(v);sync();});box.append(b);return [v,b];});
  function sync(){btns.forEach(([v,b])=>{b.setAttribute('aria-pressed',String(sel.has(v)));b.disabled=taken.has(v)||(!sel.has(v)&&sel.size>=need);});count.textContent=sel.size+' of '+need+' chosen';}

function pickCell(x,k,org,list,h){
  if(!k||!k.picks.length)return null;const cur=chosenOf(x),lab=(k.each>1?plural(k.label):k.label);

  return el('span',{class:'pkedit'},[el('span',{class:'pk',text:(cur.join(', ')||'No '+plural(k.label).toLowerCase()+' yet')+' · '},[el('button',{type:'button',class:'linkish',text:'change',onclick:()=>{panel.hidden=!panel.hidden;}})]),panel]);

function picksView(list,k,org,setWinner){
  const by=v=>list.filter(x=>chosenOf(x).includes(v));
  const kids=[el('h3',{text:k.label+' picks'}),el('p',{class:'autonote',text:k.picks.length+' '+plural(k.label).toLowerCase()+' in this pool. Each player picks '+nOf(k.each,k.label)+(k.unique?', and each '+k.label.toLowerCase()+' can only be picked once.':'.')})];
  if(org){const s=el('select',{id:'winPick','aria-label':'Winning '+k.label.toLowerCase()},[el('option',{value:'',text:'Not decided yet'}),...k.picks.map(v=>el('option',{value:v,text:v,selected:v===k.winning}))]);
    s.addEventListener('change',e=>setWinner(e.target.value));
    kids.push(el('label',{class:'winpick'},[el('span',{class:'lbl',text:'Winning '+k.label.toLowerCase()}),s]),
      el('p',{class:'autonote',text:'Pick the winner and everyone who chose it takes 1st place. Leave it on "Not decided yet" to rank by points instead.'}));}

    return el('div',{class:'pick'+(won?' gold':'')+(k.unique&&ws.length?' gone':'')},[el('div',{class:'pn',text:(won?'🏆 ':'')+v}),el('div',{class:'who',text:ws.length?ws.map(x=>x.name).join(', '):(k.unique?'Open':'No picks yet')})]);})));
  return el('section',{class:'block'},kids);

function chatNote(m){$('chatNote').textContent=m||'';}
function renderChat(){

    return el('div',{class:'msg'+(mine?' me':'')},[el('div',{class:'mh'},[el('b',{text:mine?'You':m.name}),el('span',{text:tfmt(m.created_at)}),isOrg()?el('button',{class:'del','aria-label':'Delete message',text:'✕',onclick:()=>delMsg(m)}):null]),el('div',{class:'mt',text:m.body})]);}));

function addMsg(m){if(!m||m.pool_id!==poolId||msgs.some(x=>x.id===m.id))return;msgs.push(m);msgs.sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));if(msgs.length>200)msgs=msgs.slice(-200);renderChat();}
async function loadChat(){
  const r=await SB.from('bp_messages').select('id,pool_id,name,body,client_id,created_at').eq('pool_id',poolId).order('created_at',{ascending:false}).limit(100);
  if(r.error){if(/bp_messages|does not exist|schema cache/i.test(r.error.message||'')){chatOff=true;renderChat();return;}chatNote('Chat can\'t be reached right now.');return;}
  msgs=(r.data||[]).reverse();chatReady=true;chatNote('');renderChat();
}
async function sendMsg(body){
  const row={id:(crypto.randomUUID?crypto.randomUUID():undefined),pool_id:poolId,name:myName(),body,client_id:clientId};
  if(!row.id)delete row.id;
  const r=await SB.from('bp_messages').insert(row).select('id,pool_id,name,body,client_id,created_at').single();
  if(r.error){chatNote(/busy/i.test(r.error.message||'')?'Chat is busy. Wait a few seconds and try again.':'Message didn\'t send. Check your connection and try again.');$('chatInput').value=$('chatInput').value||body;return;}
  chatNote('');addMsg(r.data);const l=$('chatList');l.scrollTop=l.scrollHeight;

async function delMsg(m){msgs=msgs.filter(x=>x.id!==m.id);renderChat();const r=await SB.from('bp_messages').delete().eq('id',m.id);if(r.error){chatNote('Couldn\'t delete that message.');loadChat();}}
function startChat(){
  if(!SB||!poolId)return;
  loadChat();
  SB.channel('chat-'+poolId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'bp_messages',filter:'pool_id=eq.'+poolId},p=>addMsg(p.new))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'bp_messages'},p=>{const id=p.old&&p.old.id;if(id&&msgs.some(x=>x.id===id)){msgs=msgs.filter(x=>x.id!==id);renderChat();}})
    .subscribe(s=>{chatLive=s==='SUBSCRIBED';});
  // Backup in case live updates are blocked on someone's network.
  chatPoll=setInterval(()=>{if(!chatLive&&!chatOff&&document.visibilityState==='visible')loadChat();},8000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!chatOff)loadChat();});
}
$('chatFab').addEventListener('click',()=>{chatOpen=true;renderChat();setTimeout(()=>{const l=$('chatList');l.scrollTop=l.scrollHeight;const i=myName()?$('chatInput'):$('chatName');if(!myName()&&me&&isOrg()&&!i.value)i.value='Organizer';i.focus();},0);});
$('chatClose').addEventListener('click',()=>{chatOpen=false;renderChat();$('chatFab').focus();});
$('chatSheet').addEventListener('keydown',e=>{if(e.key==='Escape'){chatOpen=false;renderChat();$('chatFab').focus();}});
$('chatNameForm').addEventListener('submit',e=>{e.preventDefault();const v=$('chatName').value.trim().slice(0,30);if(!v){chatNote('Type the name people will see.');return;}store.set('pool-chat-name',v);chatNote('');renderChat();setTimeout(()=>$('chatInput').focus(),0);});
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('chatInput'),v=i.value.trim().slice(0,280);if(!v)return;i.value='';sendMsg(v);});

async function start(){
  if(!SB){render();return;}
  const {data}=await SB.auth.getSession();me=data.session?data.session.user:null;
  SB.auth.onAuthStateChange((ev,s)=>{const was=me&&me.id;me=s?s.user:null;if((me&&me.id)!==was){mode='view';if(poolId)render();else if(me)loadMine();else render();}});
  if(poolId){await loadPool();startChat();
    // keep the pot live while the page is open
    timer=setInterval(()=>{if(document.visibilityState==='visible'&&mode==='view')loadPool(true);},10000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadPool(true);});
  }else if(me)await loadMine();else render();
  if(!poolId&&!store.get('pool-tour-seen'))setTimeout(()=>{if(mode==='view'&&!tour)startTour();},900);
  $('who').textContent=poolId?'Live pool. Refreshes every few seconds.':'Buy-ins, who\'s in, and what the pot pays out.';
}
start();
})();
</script>
